<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 --night:#0B1B2E;--night2:#112841;--nightLine:rgba(201,240,58,.10);--paper:#F4F5F0;--surface:#FFFFFF;--ink:#0B1B2E;--steel:#5A6670;--line:#DCE0D8;
 --green:#1E7A38;--leaf:#9ACB63;--blue:#2560A8;--sky:#3FA3DC;--hivis:#C9F03A;--onNight:#EEF3F6;--onNightMute:#AFC0D0;
 --display:'Rubik',system-ui,'Arial Hebrew',Arial,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
 --r:14px;--ease:cubic-bezier(.2,.7,.2,1);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--night:#07131F;--night2:#0D2033;--paper:#0F1B27;--surface:#152536;--ink:#E7EDF1;--steel:#A3B1BE;--line:#26394C;--green:#72C487;--blue:#7AB6EC;color-scheme:dark}}
:root[data-theme="dark"]{--night:#07131F;--night2:#0D2033;--paper:#0F1B27;--surface:#152536;--ink:#E7EDF1;--steel:#A3B1BE;--line:#26394C;--green:#72C487;--blue:#7AB6EC;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{overflow-x:clip;scroll-behavior:smooth;scroll-padding-top:84px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 17px/1.65 var(--display);-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
[hidden]{display:none!important}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.018em;margin:0;text-wrap:balance}
p{margin:0}
.num,bdi{unicode-bidi:isolate}
.mono{font-family:var(--mono);font-weight:500;letter-spacing:.02em}
.wrap{max-width:1240px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
.eyebrow{font:600 12.5px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--green);display:flex;align-items:center;gap:10px}
.eyebrow svg{width:22px;height:22px;flex:none}
.night .eyebrow{color:var(--hivis)}
.sec{padding-block:clamp(72px,10vw,128px)}
.sec h2{font-size:clamp(34px,4.8vw,64px);margin-top:14px}
.lead{font-size:clamp(17px,1.5vw,20px);color:var(--steel);max-width:62ch;margin-top:16px}
.night{background:var(--night);color:var(--onNight);position:relative;isolation:isolate}
.night .lead{color:var(--onNightMute)}
.grid-bg::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(var(--nightLine) 1px,transparent 1px),linear-gradient(90deg,var(--nightLine) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 75%)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:6px}
.night :focus-visible{outline-color:var(--hivis)}
.skip{position:absolute;inset-inline-start:12px;top:-60px;z-index:200;background:var(--hivis);color:#0B1B2E;padding:10px 16px;border-radius:10px;font-weight:700}
.skip:focus{top:12px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 24px;border-radius:999px;border:0;background:var(--green);color:#fff;font:700 16.5px/1 var(--display);text-decoration:none;cursor:pointer;transition:transform .2s var(--ease),background .2s,box-shadow .2s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 24px -12px rgba(11,27,46,.55)}
.btn.hv{background:var(--hivis);color:#0B1B2E}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
.btn .ar{font-size:18px;transition:transform .2s var(--ease)}
.btn:hover .ar{transform:translateX(-4px)}
.mini{min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}
.mini.warn{border-color:#E3A7A0;color:#A3261A}
.tag{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--mono);letter-spacing:.06em;padding:6px 9px;border-radius:999px;background:rgba(11,27,46,.72);color:#fff;backdrop-filter:blur(6px)}
.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--hivis)}
.tag.sch::before{background:var(--sky)}
.ph{position:relative;overflow:hidden;border-radius:var(--r);background:#1b2c3f}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .tag{position:absolute;inset-inline-start:10px;bottom:10px}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;transition:background .3s,box-shadow .3s,color .3s;color:var(--onNight)}
.hdr.scrolled{background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(12px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hdr .in{display:flex;align-items:center;gap:22px;height:72px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.logo svg{width:42px;height:42px}
.logo .wm{display:flex;flex-direction:column;line-height:1}
.logo .wm small{font:500 12px/1 var(--display);opacity:.8;margin-bottom:3px}
.logo .wm b{font:800 21px/1 var(--display);letter-spacing:-.01em}
.nav{display:flex;gap:4px;margin-inline-start:auto}
.nav a{text-decoration:none;font-weight:500;font-size:15px;padding:8px 10px;border-radius:8px;opacity:.86}
.nav a:hover,.nav a[aria-current="true"]{opacity:1;background:rgba(127,140,150,.14)}
.hdr .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.call{display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;background:var(--hivis);color:#0B1B2E;text-decoration:none;font:700 15px/1 var(--display)}
.hdr .call .mono{font-weight:600}
.burger{display:none;width:44px;height:44px;border-radius:12px;border:1.5px solid currentColor;background:transparent;cursor:pointer;margin-inline-start:auto}
.burger i{display:block;width:18px;height:2px;background:currentColor;margin:4px auto;border-radius:2px}
#admBtn{display:none}
@media (max-width:1080px){.nav{display:none}.burger{display:block}.hdr .call{display:none}}
.drawer{position:fixed;inset:0;z-index:90;background:rgba(7,19,31,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer.open{opacity:1;pointer-events:auto}
.drawer .in{position:absolute;inset-block:0;inset-inline-end:0;width:min(86vw,380px);background:var(--night);color:var(--onNight);padding:22px 22px 30px;display:flex;flex-direction:column;gap:4px;transform:translateX(-100%);transition:transform .3s var(--ease);overflow:auto}
.drawer.open .in{transform:none}
.drawer a.dl{font:700 24px/1.2 var(--display);text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08)}

/* hero */
.hero{margin-top:-72px;padding-top:112px;padding-bottom:clamp(56px,8vw,96px);overflow:hidden}
.hero .in{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,5vw,72px);align-items:center}
.hero h1{font-size:clamp(44px,7vw,100px);line-height:.96}
.hero h1 em{font-style:normal;color:var(--hivis)}
.hero .sub{font-size:clamp(17px,1.6vw,21px);color:var(--onNightMute);max-width:44ch;margin-top:22px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero .kick{font:600 13px/1 var(--mono);letter-spacing:.12em;color:var(--hivis);margin-bottom:22px;display:flex;flex-wrap:wrap;gap:6px 14px}
.hero .kick span+span::before{content:"·";margin-inline-end:14px;opacity:.6}
.blades{position:relative;width:100%;max-width:560px;margin-inline:auto;aspect-ratio:1}
.blades svg{width:100%;height:100%;overflow:visible}
.blades .bl{transform-box:view-box;transform-origin:256px 256px;cursor:pointer;transition:filter .3s}
.blades .bl:hover,.blades .bl:focus-visible{filter:brightness(1.12)}
.blades .lbl{font:600 15px var(--mono);fill:#fff;paint-order:stroke;stroke:rgba(7,19,31,.55);stroke-width:4px;letter-spacing:.04em}
.blades .tag{position:absolute;bottom:2%;inset-inline-start:0}
.hero .note{font:500 12.5px/1.5 var(--mono);color:var(--onNightMute);margin-top:18px}
.tickets{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-top:clamp(40px,6vw,72px);border-top:1px dashed rgba(201,240,58,.35);border-bottom:1px dashed rgba(201,240,58,.35)}
.tickets div{padding:18px 14px;border-inline-start:1px dashed rgba(201,240,58,.2)}
.tickets div:first-child{border-inline-start:0}
.tickets b{display:block;font:600 clamp(24px,2.6vw,34px)/1 var(--mono);color:#fff;direction:ltr;text-align:right}
.tickets span{display:block;font-size:13.5px;color:var(--onNightMute);margin-top:8px;line-height:1.35}
@media (max-width:900px){.hero .in{grid-template-columns:1fr}.blades{max-width:min(84vw,400px);order:-1}.tickets{grid-template-columns:repeat(3,1fr)}.tickets div:nth-child(4){border-inline-start:0}.tickets div:nth-child(n+4){border-top:1px dashed rgba(201,240,58,.2)}}
@media (max-width:480px){.tickets{grid-template-columns:repeat(2,1fr)}.tickets div:nth-child(odd){border-inline-start:0}.tickets div:nth-child(n+3){border-top:1px dashed rgba(201,240,58,.2)}.tickets div:nth-child(4){border-inline-start:1px dashed rgba(201,240,58,.2)}}

/* circle */
.circle .in{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(28px,5vw,80px);align-items:center;margin-top:48px}
.ring{position:relative;max-width:520px;width:100%;margin-inline:auto;aspect-ratio:1}
.ring svg{width:100%;height:100%;overflow:visible}
.ring .seg{fill:none;stroke-width:34;stroke-linecap:butt;cursor:pointer;transition:opacity .3s,stroke-width .3s}
.ring .seg:not(.on){opacity:.28}
.ring .seg.on{stroke-width:42}
.ring .sl{font:700 17px var(--display);fill:var(--onNight);text-anchor:middle;pointer-events:none}
.ring .sn{font:600 12px var(--mono);fill:var(--onNightMute);text-anchor:middle;pointer-events:none;letter-spacing:.08em}
.ring .core{text-anchor:middle}
.ring .core .big{font:800 64px var(--display);fill:#fff}
.ring .core .small{font:500 14px var(--display);fill:var(--onNightMute)}
.ring .dot{fill:var(--hivis);filter:drop-shadow(0 0 8px rgba(201,240,58,.8))}
.stages{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.stages button{min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid rgba(255,255,255,.18);background:transparent;color:var(--onNight);font:600 15px var(--display);cursor:pointer;display:flex;align-items:center;gap:8px}
.stages button .mono{font-size:12px;opacity:.7}
.stages button[aria-selected="true"]{background:var(--hivis);color:#0B1B2E;border-color:var(--hivis)}
.stage{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.stage h3{font-size:clamp(28px,3vw,40px)}
.stage p{color:var(--onNightMute);margin-top:12px}
.stage .ph{aspect-ratio:4/5}
.stage .fact{margin-top:18px;padding:14px 16px;border:1px dashed rgba(201,240,58,.4);border-radius:12px;font:600 15px/1.45 var(--mono);color:var(--hivis)}
.stage ul{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:8px}
.stage li a{display:flex;justify-content:space-between;gap:10px;text-decoration:none;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1);font-weight:500}
.stage li a:hover{color:var(--hivis)}
.closing{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-top:clamp(48px,7vw,88px);padding-top:32px;border-top:1px solid rgba(255,255,255,.1)}
.closing .ph{width:clamp(120px,18vw,210px);aspect-ratio:1;border-radius:50%}
.closing blockquote{margin:0;font:700 clamp(22px,2.6vw,34px)/1.3 var(--display)}
.closing cite{display:block;margin-top:10px;font:500 13px var(--mono);color:var(--onNightMute);font-style:normal}
@media (max-width:600px){.ring .sl{font-size:28px}.ring .sn{font-size:18px}.ring .core .small{font-size:22px}}
@media (max-width:900px){.circle .in{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.stage .ph{aspect-ratio:16/10;order:-1}.ring{max-width:380px}}
@media (max-width:560px){.closing{grid-template-columns:1fr}}

/* services */
.svc-group{margin-top:56px}
.svc-group>header{display:flex;align-items:center;gap:14px;padding-bottom:14px;border-bottom:1.5px solid var(--ink)}
.svc-group>header svg{width:34px;height:34px}
.svc-group>header h3{font-size:24px}
.svc-group>header .mono{margin-inline-start:auto;color:var(--steel);font-size:13px}
.svc-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}
.svc{background:var(--surface);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line);transition:transform .25s var(--ease),box-shadow .25s}
.svc:hover{transform:translateY(-4px);box-shadow:0 22px 40px -28px rgba(11,27,46,.5)}
.svc .ph{border-radius:0;aspect-ratio:16/10}
.svc .b{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.svc h4{font-size:21px;line-height:1.15}
.svc p{color:var(--steel);font-size:15.5px}
.svc button{margin-top:auto;align-self:flex-start;background:none;border:0;padding:8px 0 0;color:var(--green);font:700 15.5px var(--display);cursor:pointer;display:flex;gap:8px;align-items:center}
.svc button::after{content:"←";transition:transform .2s}
.svc button:hover::after{transform:translateX(-4px)}
@media (max-width:980px){.svc-row{grid-template-columns:repeat(2,1fr)}}
@media (max-width:600px){.svc-row{grid-template-columns:1fr}}

/* dialogs */
dialog{border:0;padding:0;border-radius:20px;max-width:min(920px,calc(100vw - 24px));width:100%;background:var(--surface);color:var(--ink);box-shadow:0 40px 80px -30px rgba(7,19,31,.6)}
dialog::backdrop{background:rgba(7,19,31,.62);backdrop-filter:blur(4px)}
.dlg{padding:clamp(20px,4vw,40px);max-height:min(86vh,900px);overflow:auto}
.dlg .x{position:sticky;top:0;float:left;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer;z-index:2}
.dlg h3{font-size:clamp(28px,3.4vw,42px);margin:10px 0 14px}
.dlg p{margin-top:12px;color:var(--steel)}
.dlg ul{margin:14px 0 0;padding-inline-start:20px;display:grid;gap:6px}
.dlg .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.dlg .gal .ph{aspect-ratio:4/3}
.dlg .acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.dlg .who{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.dlg .who span{padding:10px 14px;border-radius:12px;background:var(--paper);font-weight:600}
@media (max-width:600px){.dlg .gal{grid-template-columns:1fr 1fr}}

/* calculator */
.calc .panel{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(20px,4vw,56px);margin-top:44px;align-items:start}
.calc fieldset{border:0;padding:0;margin:0}
.calc legend,.calc label.l{font:600 12.5px var(--mono);letter-spacing:.1em;color:var(--steel);margin-bottom:10px;display:block}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip label{display:block;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;transition:border-color .2s,box-shadow .2s;height:100%}
.chip label b{display:block;font-size:17px}
.chip label span{display:block;font:500 13px var(--mono);color:var(--steel);margin-top:4px}
.chip input:checked+label{border-color:var(--green);box-shadow:inset 0 0 0 1.5px var(--green)}
.chip input:focus-visible+label{outline:3px solid var(--blue);outline-offset:2px}
.field{margin-top:26px}
.area{display:flex;align-items:center;gap:14px}
.area input[type=range]{flex:1;accent-color:var(--green);height:32px}
.area input[type=number]{width:130px;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font:600 18px var(--mono);direction:ltr;text-align:center}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dims label{font:500 13px var(--display);color:var(--steel)}
.dims input{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font:600 17px var(--mono);direction:ltr;text-align:center;margin-top:4px}
.ticket{background:#FBFBF7;color:#0B1B2E;border-radius:6px;padding:26px 24px 22px;font-family:var(--mono);position:relative;box-shadow:0 30px 60px -36px rgba(11,27,46,.55);--hole:radial-gradient(circle at 0 50%,transparent 9px,#000 9.5px);-webkit-mask:radial-gradient(circle 9px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat;mask:radial-gradient(circle 9px at 0 62%,transparent 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 9px at 100% 62%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .th{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1.5px dashed #9AA5AE;font-size:12px;letter-spacing:.08em}
.ticket .th svg{width:30px;height:30px}
.ticket dl{margin:14px 0 0;display:grid;grid-template-columns:auto 1fr;gap:9px 14px;font-size:14px}
.ticket dt{color:#5A6670}
.ticket dd{margin:0;text-align:left;font-weight:600;direction:rtl}
.ticket .total{margin-top:16px;padding-top:14px;border-top:1.5px dashed #9AA5AE}
.ticket .total small{display:block;font-size:12px;letter-spacing:.08em;color:#5A6670}
.ticket .total b{display:block;font-size:clamp(34px,4vw,48px);line-height:1.1;letter-spacing:-.02em}
.band{margin-top:14px;height:12px;border-radius:6px;background:#E6E9E2;position:relative}
.band i{position:absolute;inset-block:0;border-radius:6px;background:linear-gradient(90deg,#9ACB63,#1E7A38)}
.band u{position:absolute;top:-5px;width:3px;height:22px;background:#0B1B2E;border-radius:2px}
.band-l{display:flex;justify-content:space-between;font-size:11.5px;color:#5A6670;margin-top:6px;direction:ltr}
.back{margin-top:14px;display:flex;gap:10px;align-items:center;font-size:13.5px;line-height:1.4;color:#1E5B2E;background:#EAF4DD;border-radius:10px;padding:10px 12px}
.back svg{width:26px;height:26px;flex:none}
.stamp{position:absolute;top:16px;inset-inline-start:50%;transform:translateX(-50%) rotate(-8deg);border:2px solid #2560A8;color:#2560A8;border-radius:6px;padding:3px 8px;font-size:11px;letter-spacing:.12em;opacity:.92}
.calc .fine{font:500 12.5px/1.6 var(--mono);color:var(--steel);margin-top:14px}
@media (max-width:900px){.calc .panel{grid-template-columns:1fr}}
@media (max-width:420px){.chips{grid-template-columns:1fr}}

/* sites */
.sites .in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);margin-top:44px;align-items:start}
.map{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:10px;position:relative}
.map svg{width:100%;height:auto;max-height:560px;display:block;margin-inline:auto}
.map .sea{fill:color-mix(in srgb,var(--sky) 14%,var(--surface))}
.map .land{fill:var(--surface)}
.map .coast{fill:none;stroke:var(--steel);stroke-width:1.4}
.map .ref{font:500 11px var(--mono);fill:var(--steel)}
.map .pin{cursor:pointer}
.map .pin circle.o{fill:var(--green);transition:r .2s}
.map .pin.on circle.o{fill:var(--blue)}
.map .pin text{font:700 13px var(--display);fill:var(--ink)}
.map .tag{position:absolute;inset-inline-start:14px;bottom:14px}
.site-list{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.site-list button{width:100%;text-align:start;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.site-list button .n{grid-row:span 2;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font:600 13px var(--mono)}
.site-list button b{font-size:18px}
.site-list button span{color:var(--steel);font-size:14.5px;line-height:1.45}
.site-list button[aria-pressed="true"]{border-color:var(--green)}
.site-list button[aria-pressed="true"] .n{background:var(--green);color:#fff}
.park{margin-top:clamp(40px,6vw,72px);display:grid;grid-template-columns:1.1fr .9fr;border-radius:24px;overflow:hidden;background:var(--night);color:var(--onNight)}
.park .ph{border-radius:0;min-height:320px}
.park .b{padding:clamp(22px,4vw,48px)}
.park h3{font-size:clamp(28px,3.2vw,44px);margin-top:10px}
.park p{color:var(--onNightMute);margin-top:12px}
.park .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.park .row span{font:600 13px var(--mono);padding:8px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
@media (max-width:900px){.sites .in,.park{grid-template-columns:1fr}}

/* projects */
.vids{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.vid{text-decoration:none;display:flex;flex-direction:column;gap:12px}
.vid .ph{aspect-ratio:16/9}
.vid .play{position:absolute;inset:0;display:grid;place-items:center}
.vid .play span{width:64px;height:64px;border-radius:50%;background:rgba(201,240,58,.94);display:grid;place-items:center;transition:transform .25s var(--ease)}
.vid:hover .play span{transform:scale(1.1)}
.vid .play svg{width:24px;height:24px;margin-inline-start:-3px}
.vid b{font-size:18px;line-height:1.3}
.vid small{font:500 13px var(--mono);color:var(--onNightMute)}
.vid:first-child{grid-column:span 2;grid-row:span 2}
.vid:first-child b{font-size:24px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:40px}
.strip button{padding:0;border:0;background:none;cursor:zoom-in;display:block}
.strip .ph{aspect-ratio:1}
.strip .ph img{transition:transform .5s var(--ease)}
.strip button:hover img{transform:scale(1.05)}
@media (max-width:900px){.vids{grid-template-columns:1fr 1fr}.vid:first-child{grid-column:span 2;grid-row:auto}.strip{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.vids{grid-template-columns:1fr}.vid:first-child{grid-column:auto}}
.lb{background:#000;max-width:min(1200px,calc(100vw - 16px))}
.lb figure{margin:0;position:relative}
.lb img{max-height:82vh;margin-inline:auto}
.lb figcaption{color:#fff;padding:12px 16px;font-size:15px}
.lb .x{position:absolute;top:10px;left:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.9);font-size:22px;cursor:pointer}

/* film */
.film .in{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,72px);align-items:center;margin-top:40px}
.film video{width:min(360px,80vw);aspect-ratio:9/16;border-radius:22px;background:#000;display:block;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.film .facts{display:grid;gap:14px;margin-top:22px}
.film .facts div{display:flex;gap:12px;align-items:baseline;border-bottom:1px dashed rgba(255,255,255,.14);padding-bottom:12px}
.film .facts b{font:600 14px var(--mono);color:var(--hivis);min-width:74px}
@media (max-width:820px){.film .in{grid-template-columns:1fr;justify-items:center}}

/* about */
.story{display:grid;grid-template-columns:.9fr 1.1fr;gap:clamp(24px,5vw,72px);margin-top:44px;align-items:start}
.story .ph{aspect-ratio:4/5}
.story figcaption{font:500 13px var(--mono);color:var(--steel);margin-top:10px}
.tl{list-style:none;padding:0;margin:0;position:relative}
.tl::before{content:"";position:absolute;inset-block:8px;inset-inline-start:58px;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:118px 1fr;gap:0;padding-bottom:22px;position:relative}
.tl li::after{content:"";position:absolute;inset-inline-start:52px;top:7px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--green)}
.tl .y{font:600 15px var(--mono);color:var(--green);direction:ltr;text-align:right;padding-inline-end:76px;white-space:nowrap}
.tl b{display:block;font-size:19px}
.tl p{color:var(--steel);font-size:15.5px;margin-top:4px}
.values{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.values span{padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:600}
.cos{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:48px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.co .mono{font-size:12px;color:var(--green);letter-spacing:.08em}
.co h3{font-size:22px;margin-top:8px}
.co p{color:var(--steel);font-size:15.5px;margin-top:8px}
@media (max-width:900px){.story,.cos{grid-template-columns:1fr}}

/* reviews */
.revs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:40px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px}
.rev q{font-size:18px;line-height:1.6;quotes:"״" "״"}
.rev b{display:block;margin-top:14px}

/* faq + agent */
.faqw{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(24px,4vw,56px);margin-top:44px;align-items:start}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:18px 0;font-weight:700;font-size:18px;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:500 26px/1 var(--mono);color:var(--green);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{padding-bottom:18px;color:var(--steel)}
.agent{background:var(--night);color:var(--onNight);border-radius:22px;overflow:hidden;position:sticky;top:96px;display:flex;flex-direction:column;min-height:520px}
.agent header{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.agent header svg{width:40px;height:40px}
.agent header b{display:block;font-size:18px}
.agent header span{font:500 12.5px var(--mono);color:var(--onNightMute)}
.agent header .live{margin-inline-start:auto;width:10px;height:10px;border-radius:50%;background:var(--hivis);box-shadow:0 0 0 4px rgba(201,240,58,.18)}
#advBody{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px;max-height:420px}
.bb{max-width:88%;padding:11px 14px;border-radius:16px;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.bb.ai{background:rgba(255,255,255,.08);border-start-start-radius:4px;align-self:flex-start}
.bb.me{background:var(--hivis);color:#0B1B2E;border-start-end-radius:4px;align-self:flex-end}
.typing{display:inline-flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.4;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{50%{opacity:1;transform:translateY(-3px)}}
#advChips{display:flex;flex-wrap:wrap;gap:8px;padding:0 18px 12px}
#advChips button{min-height:36px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:var(--onNight);font-size:13.5px;cursor:pointer}
#advF{display:flex;gap:8px;padding:12px;border-top:1px solid rgba(255,255,255,.08)}
#advF input{flex:1;min-height:48px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#fff;padding:0 18px}
#advF button{min-height:48px;padding:0 18px;border-radius:999px;border:0;background:var(--hivis);color:#0B1B2E;font-weight:700;cursor:pointer}
@media (max-width:900px){.faqw{grid-template-columns:1fr}.agent{position:static}}

/* jobs */
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;list-style:none;padding:0;margin:36px 0 0}
.jobs li{padding:14px 0;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:12px;align-items:baseline}
.jobs li::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--green);flex:none;transform:translateY(-2px)}
.jobmail{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:26px}
@media (max-width:700px){.jobs{grid-template-columns:1fr}}

/* contact */
.contact .in>*,.calc .panel>*,.sites .in>*,.circle .in>*,.faqw>*{min-width:0}
.contact .in{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(24px,5vw,72px);margin-top:44px;align-items:start}
.form{background:var(--surface);color:var(--ink);border-radius:22px;padding:clamp(20px,3vw,34px);display:grid;gap:16px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form label{font-weight:600;font-size:15px;display:block;margin-bottom:6px}
.form input,.form select,.form textarea{width:100%;max-width:100%;min-width:0;min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);padding:0 14px}
.form textarea{min-height:110px;padding:12px 14px;resize:vertical}
.form .spec{font:500 13.5px/1.5 var(--mono);background:#EAF4DD;color:#1E5B2E;border-radius:12px;padding:12px 14px}
.form .agree{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--steel)}
.form .agree input{width:22px;min-height:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--green)}
.form .agree button{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:14px}
.fnote{font-size:14.5px;min-height:1.4em}
.fnote.err{color:#B3261E;font-weight:600}
.sent{text-align:center;padding:16px 0;display:grid;justify-items:center;gap:10px}
.sent svg{width:120px;height:120px}
.sent h3{font-size:30px}
.sent p{color:var(--steel)}
.cards{display:grid;gap:12px}
.cc{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:16px 18px;border-radius:16px;border:1px solid rgba(255,255,255,.12)}
.cc small{font:600 12px var(--mono);letter-spacing:.08em;color:var(--onNightMute);grid-column:1}
.cc .val{font:600 clamp(16px,4.4vw,20px) var(--mono);direction:ltr;text-align:right;grid-column:1;overflow-wrap:anywhere}
.cc .val.he{direction:rtl;font:600 17px var(--display)}
.cc button{grid-row:1/span 2;grid-column:2}
.cc .mini{background:transparent;color:var(--onNight);border-color:rgba(255,255,255,.25)}
.soc{display:flex;gap:10px;margin-top:6px}
.soc a{padding:10px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.2);text-decoration:none;font-weight:600;font-size:14.5px}
@media (max-width:900px){.contact .in{grid-template-columns:1fr}}
@media (max-width:520px){.form .two{grid-template-columns:1fr}}

/* footer */
footer{background:var(--night);color:var(--onNightMute);padding-block:48px 110px;border-top:1px solid rgba(255,255,255,.06)}
footer .in{display:flex;flex-wrap:wrap;gap:24px 40px;justify-content:space-between;align-items:flex-start}
footer .logo{color:var(--onNight)}
footer nav{display:flex;flex-wrap:wrap;gap:8px 18px}
footer a,footer button.lk{color:var(--onNightMute);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font-size:15px}
footer a:hover,footer button.lk:hover{color:#fff}
footer .fine{width:100%;display:flex;flex-wrap:wrap;gap:8px 20px;font:500 13px var(--mono);padding-top:20px;border-top:1px solid rgba(255,255,255,.08)}

/* mobile bar */
.mbar{position:fixed;inset-inline:0;bottom:0;z-index:70;display:none;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--night) 94%,transparent);backdrop-filter:blur(10px);transform:translateY(110%);transition:transform .3s var(--ease)}
.mbar.on{transform:none}
.mbar a{flex:1;min-height:48px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:700;font-size:15px;color:#fff;border:1px solid rgba(255,255,255,.2)}
.mbar a.p{background:var(--hivis);color:#0B1B2E;border:0}
@media (max-width:760px){.mbar{display:flex}}

/* a11y */
.a11y-btn{position:fixed;inset-inline-start:10px;bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:75;width:44px;height:44px;border-radius:50%;border:0;background:var(--blue);color:#fff;cursor:pointer;box-shadow:0 8px 20px -8px rgba(0,0,0,.5)}
.a11y-btn svg{width:26px;height:26px}
@media (min-width:761px){.a11y-btn{bottom:20px}}
.a11y{position:fixed;inset-inline-start:14px;bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:76;width:min(300px,calc(100vw - 28px));background:var(--surface);color:var(--ink);border-radius:18px;padding:16px;box-shadow:0 24px 50px -20px rgba(0,0,0,.5);display:none}
@media (min-width:761px){.a11y{bottom:78px}}
.a11y.open{display:grid;gap:8px}
.a11y b{font-size:17px}
.a11y button{min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);text-align:start;padding:0 14px;cursor:pointer;font-weight:600}
.a11y button[aria-pressed="true"]{border-color:var(--green);background:#EAF4DD;color:#0B1B2E}
.a11y .row{display:flex;gap:8px}
.a11y .row button{flex:1}
html.a-big{font-size:112%}
html.a-big body{font-size:19px}
html.a-contrast{--steel:#2E3740;--line:#8C969F;--onNightMute:#DCE6EE}
html.a-links a{text-decoration:underline!important;text-underline-offset:3px}
html.a-still *,html.a-still *::before,html.a-still *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
html.a-font body,html.a-font h1,html.a-font h2,html.a-font h3{font-family:Arial,'Arial Hebrew',sans-serif!important;letter-spacing:0!important}

/* admin */
.adm{position:fixed;inset:0;z-index:120;background:var(--paper);color:var(--ink);display:none;grid-template-columns:240px 1fr}
.adm.open{display:grid}
.adm nav{background:var(--night);color:var(--onNight);padding:22px 14px;display:flex;flex-direction:column;gap:6px}
.adm nav b{font-size:20px;padding:0 10px 14px}
.adm .tab{min-height:44px;border-radius:10px;border:0;background:transparent;color:inherit;text-align:start;padding:0 12px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.adm .tab.on{background:rgba(201,240,58,.16);color:var(--hivis)}
.adm .tab .cnt{background:var(--hivis);color:#0B1B2E;border-radius:999px;padding:1px 8px;font-size:12px}
.adm main{overflow:auto;padding:clamp(18px,3vw,40px)}
.adm h2{font-size:34px}
.adm .sub{color:var(--steel);margin:6px 0 20px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font:600 34px var(--mono)}
.kpi.hot{border-color:var(--green)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.lead-row{display:grid;grid-template-columns:1.3fr 1fr auto auto;gap:12px;align-items:start}
.lead-row .msg{grid-column:1/-1;background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
.badge{display:inline-block;font:600 11.5px var(--mono);padding:3px 8px;border-radius:999px;background:var(--paper);margin:6px 6px 0 0}
.badge.ai{background:#E4EEFA;color:#1B4B8A}.badge.calc{background:#EAF4DD;color:#1E5B2E}
.cform{display:grid;gap:12px}
.cform label{font-weight:600;font-size:14px;display:block;margin-bottom:4px}
.cform input,.cform textarea,.lead-row select,.lead-row textarea{width:100%;min-height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);padding:8px 12px}
.cform textarea{min-height:90px}
.savebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;bottom:0;background:var(--paper);padding:12px 0}
.empty{color:var(--steel);padding:20px;border:1.5px dashed var(--line);border-radius:14px}
.confirm{display:flex;gap:6px;align-items:center;font-size:14px}
@media (max-width:800px){.adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}.adm nav{flex-direction:row;overflow:auto;padding:10px}.adm nav b{display:none}.adm .tab{white-space:nowrap}.kpis{grid-template-columns:1fr 1fr}.lead-row{grid-template-columns:1fr}}


/* preview banner */
.pv{background:#C9F03A;color:#0B1B2E;font:600 13px/1.4 var(--mono);text-align:center;padding:7px 16px;position:relative;z-index:61}
.pv b{font-family:var(--display)}
/* סבבי */
.sb{position:fixed;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:74;opacity:0;transform:translateY(24px) scale(.8);transition:opacity .35s,transform .5s var(--ease)}
.sb.on{opacity:1;transform:none}
.sb.pre-born{opacity:0!important}
@media (max-width:760px){.sb{bottom:calc(76px + env(safe-area-inset-bottom,0px));inset-inline-end:10px}}
.sb-btn{display:block;width:70px;height:88px;padding:0;border:0;background:none;cursor:pointer;filter:drop-shadow(0 10px 12px rgba(7,19,31,.3));transition:transform .35s var(--ease)}
.sb-btn:hover{transform:translateY(-3px)}
@media (max-width:760px){.sb-btn{width:54px;height:68px}}
.sb-btn svg,.sb-mini svg{width:100%;height:100%;overflow:visible;shape-rendering:crispEdges}
.sb .f,.sb-mini .f,.sb .zz,.sb-mini .zz{display:none}
.sb[data-st="idle"] .f-idle,.sb[data-st="blink"] .f-blink,.sb[data-st="look"] .f-look,.sb[data-st="happy"] .f-happy,.sb[data-st="spin"] .f-happy,.sb[data-st="think"] .f-think,.sb[data-st="sleep"] .f-sleep,.sb[data-st="surprised"] .f-surprised,.sb[data-st="love"] .f-love,.sb-mini .f-idle{display:inline}
.sb[data-st="sleep"] .zz{display:inline;animation:zz 2s infinite}
@keyframes zz{50%{opacity:.35;transform:translateY(-1px)}}
.sb[data-st="spin"] .wheel{animation:sbspin .9s cubic-bezier(.4,0,.2,1)}
@keyframes sbspin{to{transform:rotate(360deg)}}
.sb[data-walk] .sb-btn svg{animation:bob .26s infinite alternate}
@keyframes bob{to{transform:translateY(-2px)}}
.sb-bub{position:absolute;bottom:96px;inset-inline-end:-4px;width:max-content;max-width:min(320px,calc(100vw - 32px));background:#fff;color:#0B1B2E;padding:14px 16px;padding-inline-end:40px;font:500 15px/1.55 var(--display);border-radius:14px;border:2px solid #0B1B2E;opacity:0;transform:translateY(8px) scale(.96);transition:opacity .28s,transform .38s var(--ease);box-shadow:0 18px 30px -10px rgba(7,19,31,.3)}
@media (max-width:760px){.sb-bub{bottom:76px;font-size:14px}}
.sb-bub.on{opacity:1;transform:none}
.sb-bub::after{content:"";position:absolute;inset-inline-end:26px;bottom:-9px;width:14px;height:14px;background:#fff;border-inline-start:2px solid #0B1B2E;border-bottom:2px solid #0B1B2E;transform:rotate(-45deg)}
.sb-bub p{margin:0}
.sb-x{position:absolute;top:8px;inset-inline-end:8px;width:26px;height:26px;border-radius:50%;border:0;background:#EEF1EC;cursor:pointer;font-size:13px;color:#0B1B2E}
.sb-acts{display:flex;flex-wrap:wrap;gap:8px}
.sb-acts button{margin-top:10px;min-height:36px;padding:0 12px;border-radius:999px;border:0;background:#0B1B2E;color:#C9F03A;font:600 13.5px var(--display);cursor:pointer}
.sb-menu{position:absolute;bottom:96px;inset-inline-end:0;width:240px;background:#0B1B2E;color:#EEF3F6;border-radius:16px;padding:12px;display:grid;gap:4px;box-shadow:0 24px 50px -20px rgba(0,0,0,.6)}
.sb-menu b{padding:4px 8px 8px;font-size:15px}
.sb-menu button{min-height:40px;border-radius:10px;border:0;background:transparent;color:inherit;text-align:start;padding:0 10px;cursor:pointer;font:500 15px var(--display);display:flex;gap:10px;align-items:center}
.sb-menu button:hover,.sb-menu button:focus-visible{background:rgba(201,240,58,.14)}
.sb-menu button i{width:8px;height:8px;background:#C9F03A;border-radius:2px}
.sb-menu button.dim{opacity:.7}
.sb-beam{position:fixed;z-index:80;width:26px;height:26px;pointer-events:none;background:conic-gradient(#9ACB63 0 25%,#3FA3DC 0 50%,#9ACB63 0 75%,#3FA3DC 0);border-radius:50%;box-shadow:0 0 18px 6px rgba(201,240,58,.6)}
.sb-lit{outline:3px solid #C9F03A!important;outline-offset:6px;border-radius:12px;transition:outline-color .3s}
.sb-seed{position:fixed;z-index:160;width:36px;height:36px;border-radius:50%;pointer-events:none;background:conic-gradient(#9ACB63 0 25%,#3FA3DC 0 50%,#9ACB63 0 75%,#3FA3DC 0);box-shadow:0 0 24px 8px rgba(201,240,58,.55)}
.sb-conf{position:fixed;z-index:80;width:8px;height:8px;border-radius:2px;pointer-events:none}
.sb-mini{display:inline-block;width:40px;height:50px;flex:none}
.meet{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin-top:28px;padding:20px 22px;border-radius:18px;border:1px dashed rgba(201,240,58,.35)}
.meet .sb-mini{width:84px;height:104px}
.meet b{font:800 24px var(--display);color:#fff}
.meet p{color:var(--onNightMute);margin-top:6px;max-width:60ch}
.meet .states{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.meet .states span{font:600 11.5px var(--mono);padding:4px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.18)}
#sbBack{background:none;border:0;padding:0;color:var(--onNightMute);cursor:pointer;font-size:15px}

/* reveal + intro */
.rv{transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.pre{opacity:0;transform:translateY(22px)}
#intro{position:fixed;inset:0;z-index:150;background:var(--night);display:grid;place-items:center}
#intro svg{width:min(46vw,260px);height:auto;overflow:visible}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
