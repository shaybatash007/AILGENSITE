<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brand film engine</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
  Brand film engine. One file renders a launch film for any brand from a project's film.json.
  Every frame is a pure function of time, render(t), so render.mjs can step it at 30 fps and
  pipe frames to ffmpeg. The same scenes lay themselves out for 9:16, 4:5, 1:1 and 16:9.

  Query:  ?p=/projects/<slug>/  &w=1080 &h=1920  [&t=4.2 | &still=feed-4x5]

const Q = new URLSearchParams(location.search);

/* ---------------- math ---------------- */

/* ---------------- assets ---------------- */
const IMG = {};
const url = p => /^(\/|https?:|data:)/.test(p) ? p : P + p;
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => i.decode().then(() => res(i), () => res(i)); i.onerror = () => rej(new Error('image not found: ' + src)); i.src = url(src); }); }

    accent: '#FFB23E', accent2: '#4F7CFF', accentInk: '#111318', line: 'rgba(255,255,255,.14)', real: '#2BD46B', render: '#34CFE8', concept: '#FFB23E', demo: '#A7ADC0', stock: '#A7ADC0' }, CFG.colors || {});

    await new Promise(r => { l.onload = r; l.onerror = r; document.head.appendChild(l); });
  }
  const sample = RTL ? 'אבגדה 0123 Aa' : 'Aa Bb 0123';
  await Promise.all([`${F.dw} 100px ${F.disp}`, `${F.bw} 40px ${F.body}`, `700 40px ${F.body}`, `${F.nw} 80px ${F.num}`].map(f => document.fonts.load(f, sample).catch(() => {})));
  const srcs = new Set();
  const logo = CFG.logo || {}; ['light', 'dark'].forEach(k => logo[k] && srcs.add(logo[k]));
  for (const s of CFG.scenes) {
    s.image && srcs.add(s.image); s.bg && /\./.test(s.bg) && srcs.add(s.bg); s.shape && srcs.add(s.shape); s.final && srcs.add(s.final);
    (s.items || []).forEach(i => i.image && srcs.add(i.image)); (s.cards || []).forEach(c => c.icon && srcs.add(c.icon));
  }

function q(fam) { return /^["']|,/.test(fam) || !/\s/.test(fam) ? fam : `"${fam}"`; }

/* grain tile */
const GR = document.createElement('canvas'); GR.width = GR.height = 256;
{ const g = GR.getContext('2d'), d = g.createImageData(256, 256), r = rng(7); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

/* ---------------- timeline + cues ---------------- */

  CFG.scenes.forEach((s, i) => {
    const o = { ...s, i, t0: t, t1: t + s.dur }; SCN.push(o); t += s.dur;

    if (s.type === 'stat') { cue(o.t0 + .3, 'ticks', { until: o.t0 + 1.5 }); cue(o.t0 + 1.5, 'pop'); }
    if (s.type === 'gallery') galleryTimes(o).forEach(([a]) => cue(a, 'swish'));
    if (s.type === 'quote') { cue(o.t0, 'break', { until: o.t1 }); for (let k = 0; k < (s.stars ?? 5); k++) cue(o.t0 + .35 + k * .09, 'chime', { n: k }); }
    if (s.type === 'cards') (s.cards || []).forEach((c, k) => cue(o.t0 + .55 + k * .16, 'pop', { n: k }));
    if (s.type === 'cta') { cue(o.t0 - .6, 'riser', { until: o.t0 }); cue(o.t0 + .15, 'hit'); cue(o.t0 + .15, 'final'); cue(o.t0 + 1.35, 'pop'); }
    if (s.mascot) { cue(o.t0 + (s.mascot.at ?? .4), 'chip'); if (s.mascot.say) cue(o.t0 + (s.mascot.at ?? .4) + .35, 'type', { until: o.t0 + (s.mascot.at ?? .4) + .35 + s.mascot.say.length * .03 }); }
  });
  DUR = t;
}

/* ---------------- drawing helpers ---------------- */
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }

}
/* "*word*" marks a highlighted word, as in the sites' heroLine field */
function parseLine(line) {

/* A line of words in reading order, each with its own reveal and exit. Returns the line width. */

    const w = ws[i], x0 = RTL ? cur - w : cur;
    it._x = x0; it._w = w;
    const p = o.rev ? clamp(o.rev(i)) : 1, qx = o.exit ? clamp(o.exit(i)) : 0;
    if (p > 0 && qx < 1) {
      const e = E.quint(p), eq = E.in(qx);

function lineWidth(items, size, w = F.dw, fam = F.disp) { X.font = fnt(w, size, fam); X.letterSpacing = '0px'; return items.map(it => X.measureText(bidi(it.t)).width).reduce((a, b) => a + b, 0) + size * .24 * (items.length - 1); }
/* Kinetic headline: lines rise word by word. Size shrinks to fit the safe box. Returns the bottom y. */

function text(t, x, y, o = {}) {

}
/* Top of a block of height h inside the safe box. Tall formats sit a little high: the bottom belongs to the app's UI. */
const blockTop = (h, avail = BOX.h) => BOX.y0 + Math.max(0, avail - h) * pick(.4, .5, .5, .5);
/* Wrap body text to lines no wider than maxW. */

/* The honesty label every image carries: real / render / concept / demo */

/* Scene backgrounds: dark (brand ground), light (paper), accent, all with a soft accent glow. */
function ground(theme, lt = 0) {

    const vx = RTL ? x + cw - 36 * U - vw - uw : x + 36 * U, vy = y + ch - 84 * U;
    X.font = fnt(F.nw, 92 * U, F.num); X.textAlign = 'left'; X.fillText(vtxt, vx, vy);
    if (c.unit) { X.font = fnt(F.nw, 38 * U, F.num); X.fillStyle = C.accent; X.fillText(c.unit, vx + vw + 10 * U, vy); }
    text(c.label || '', RTL ? x + cw - 36 * U : x + 36 * U, y + ch - 34 * U, { size: 34 * U, w: 600, color: mute(th), align: RTL ? 'right' : 'left' });
    X.restore();
  });
};
/* cta: the logo lights up, one clear action */
SC.cta = (s, lt) => {
  const th = s.theme || 'dark'; ground(th, lt);
  const L = CFG.logo || {}, im = IMG[L[th === 'light' ? 'dark' : 'light']];
  const lw = BOX.w * (s.logoW || pick(.82, .64, .6, .5)), lh = im ? lw * im.height / im.width : 0;
  const hf = hlFit(s.headline || [], (s.size || pick(104, 86, 82, 84)) * U), gapL = pick(90, 50, 44, 40) * U;
  const blockH = lh + gapL + hf.h + (s.button ? pick(110, 80, 74, 70) * U + 60 * U + (s.sub || []).length * 62 * U + 90 * U : 0);
  const ly = blockTop(blockH, BOX.h - (s.mascot && CFG.mascot ? (TALL ? (s.mascot.reserve || 420) : (s.mascot.reserveWide ?? 240)) * U : 0));
  if (im) motifReveal(im, { x: W / 2 - lw / 2, y: ly, w: lw, h: lh }, seg(lt, .1, 1.1), s.motif, { contain: true, key: 'cta' + th });
  const hb = headline(s.headline || [], { y: ly + lh + gapL, size: hf.size, color: ink(th), lt, start: .7 });
  if (s.button) {
    const p = E.back(seg(lt, 1.35, 1.8)), by = hb + pick(110, 80, 74, 70) * U;
    X.save(); X.globalAlpha = clamp(p * 3);
    const bw = pill(s.button, W / 2, by, { size: 52 * U, bg: C.accent, fg: C.accentInk, w: 800, sc: p, shadow: true });
    const sh = ((lt - 1.9) * .6) % 1.6; // a light sweep across the button, once it has landed
    if (lt > 1.9 && sh < 1) { X.save(); rr(W / 2 - bw / 2, by - 52 * U * .95, bw, 52 * U * 1.9, 52 * U); X.clip(); const gx = W / 2 - bw / 2 + (bw + 200 * U) * sh - 100 * U; const g = X.createLinearGradient(gx - 60 * U, 0, gx + 60 * U, 0); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)'); X.fillStyle = g; X.fillRect(gx - 60 * U, by - 60 * U, 120 * U, 120 * U); X.restore(); }
    X.restore();
    (s.sub || []).forEach((l, i) => text(l, W / 2, by + 150 * U + i * 62 * U, { size: (i ? 40 : 46) * U, w: i ? 500 : 700, color: i ? mute(th) : ink(th), alpha: seg(lt, 1.7 + i * .15, 2.1 + i * .15) }));
  }
};

/* ---------------- composition ---------------- */
const OFF = document.createElement('canvas'); OFF.width = W; OFF.height = H; const OFFc = OFF.getContext('2d');
function drawScene(sc, t) {
  const lt = t - sc.t0; X.save(); (SC[sc.type] || (() => ground('dark', lt)))(sc, Math.max(0, lt)); X.restore();
  X.save(); sceneMascot(sc, Math.max(0, lt)); X.restore();
}
function render(t) {
  X = MAIN; X.setTransform(1, 0, 0, 1, 0, 0); X.globalAlpha = 1; X.globalCompositeOperation = 'source-over'; X.filter = 'none';
  t = clamp(t, 0, DUR - 1e-3);
  const TR = CFG.transition ?? .45;
  const i = SCN.findIndex(s => t >= s.t0 && t < s.t1), cur = SCN[i];
  const next = SCN[i + 1], prev = SCN[i - 1];
  // the change of scene happens around each boundary, over TR seconds, with the brand motif
  let a = cur, b = null, k = 0;
  if (next && t > cur.t1 - TR / 2) { b = next; k = seg(t, cur.t1 - TR / 2, cur.t1 + TR / 2); }
  else if (prev && t < cur.t0 + TR / 2) { a = prev; b = cur; k = seg(t, cur.t0 - TR / 2, cur.t0 + TR / 2); }
  drawScene(a, t);
  if (b) {
    X = OFFc; X.setTransform(1, 0, 0, 1, 0, 0); X.clearRect(0, 0, W, H); drawScene(b, t);
    motifMask(MKc, b.transition || CFG.motif || 'light', k, undefined, 21 + b.i);
    OFFc.globalCompositeOperation = 'destination-in'; OFFc.drawImage(MK, 0, 0); OFFc.globalCompositeOperation = 'source-over';
    X = MAIN; X.drawImage(OFF, 0, 0); motifEdge(b.transition || CFG.motif || 'light', k, { x: 0, y: 0, w: W, h: H }, 21 + b.i);
  }
  X = MAIN; vignette(.28); grain(t, CFG.grain ?? .045);
}
window.drawStill = name => { const s = (CFG.stills || []).find(x => x.name === name); render(s ? s.t : +(Q.get('t') || 0)); };
window.render = render;
window.READY = loadAll().then(() => {
  window.META = { W, H, DUR, FPS: CFG.fps || 30, CUES, name: CFG.name };
  window.CUES = CUES;
  Q.get('still') ? window.drawStill(Q.get('still')) : render(+(Q.get('t') || 0));
  return true;
});
