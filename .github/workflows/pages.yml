# AILGEN - publish the site to the world.
#
# This workflow is the ONLY thing that puts bytes on the public internet, and it
# uploads a declared manifest rather than the repository. That is deliberate.
#
# Measured reason: serving the branch root would publish opencode.json, AGENTS.md,
# memory/ and tools/ as indexable URLs. The repository is already public, so
# nothing new would leak - but GitHub Pages is crawled by search engines in a way
# a repository is not, and the intent here is "my website", not "my agent's notes".
#
# The manifest is publish.manifest.json at the repository root - the same file
# `node tools/publish.mjs plan` reads locally, so a dry run and this build cannot
# disagree. One source of truth, because a manifest kept in two places is a
# manifest that will be wrong in one of them.
#
# THE PUBLISH SWITCH. Actions -> pages -> Run workflow -> on / off. The state is kept in site.state.json, so a
# later push never undoes a press (tools/site-switch.mjs explains every case). On: each surface goes to its own
# Cloudflare Pages address, where every link resolves, and only after tools/link-audit.mjs passes; without
# Cloudflare secrets yet, GitHub Pages keeps the whole site as before. Off: every address shows a closed page.

name: pages

on:
  push:
    branches: ["claude/cool-fermat-us543u", "main"]
    paths-ignore:
      - "**/*.md"
      - ".opencode/**"
      - ".claude/**"
      - "tools/**"
      - "scripts/**"
      - "memory/**"
      - "campaigns/**"
  workflow_dispatch:
    # `node tools/publish.mjs sync` triggers this explicitly for a rebuild; `npm run site:on / site:off` presses the switch.
    inputs:
      action:
        description: "on: the site is public · off: every address shows a closed page · redeploy: publish again, as the switch already says"
        type: choice
        options: ["redeploy", "on", "off"]
        default: "redeploy"

permissions:
  contents: write   # the switch records its state in site.state.json
  pages: write
  id-token: write

# Never two deployments writing the same Pages slot. A publish that races itself
# produces a half-updated site, which is worse than a failed one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # the token: the secret CLOUDFLARE_API_TOKEN, or CLOUDFLARE (the name it was first saved under)
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUDFLARE }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # the AILGEN Lab's passcode (any password you choose; until it exists the lab's routes stay locked)
      LAB_PASSCODE: ${{ secrets.LAB_PASSCODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: the switch - on or off
        id: switch
        env:
          ACTION: ${{ github.event.inputs.action }}
          ACTOR: ${{ github.actor }}
        run: node tools/site-switch.mjs ci

      - name: record the new state (a later push follows it)
        if: steps.switch.outputs.changed == 'true'
        run: |
          git config user.name "site switch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site.state.json
          git commit -m "site: ${{ steps.switch.outputs.state }} (the switch, pressed by ${{ github.actor }})"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: build each surface and check every link (nothing ships with a broken one)
        if: steps.switch.outputs.state == 'on'
        run: node tools/build-surfaces.mjs && node tools/link-audit.mjs

      - name: Cloudflare Pages - each surface at the root of its own address
        if: env.CLOUDFLARE_API_TOKEN != ''   # the account ID is in surfaces.json; only the token is a secret
        run: node tools/site-switch.mjs cloudflare

      - name: the GitHub Pages copy (the whole site, a forward to the new addresses, or the closed page)
        # This is the same assembly the workstation runs locally before pushing. The
        # first version had this logic inline here and it failed on the first run
        # with ENOENT, because nothing on a GitHub runner had ever executed it
        # before it shipped. Inline-in-workflow is code nobody can test.
        run: node tools/site-switch.mjs gh-pages _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
