<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<title>Switching TV · Reel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/*
  Switching TV — "מבחן השמש" reel.
  Every frame is a pure function of time: render(t). The renderer (render.mjs) steps t at 30 fps
  and pipes the frames to ffmpeg. Query: ?w=1080&h=1920 (Reels/Stories) or ?w=1080&h=1350 (Feed 4:5).
*/
const Q = new URLSearchParams(location.search);
const W = +(Q.get('w') || 1080), H = +(Q.get('h') || 1920);
const ST = H / W > 1.5;               // true: 9:16, false: 4:5
const S = (a, b) => ST ? a : b;
const DUR = 26;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const MAIN = cv.getContext('2d');
let X = MAIN;

const C = { ink:'#07131F', ink2:'#22313F', mute:'#55636F', paper:'#F5F7FA', line:'#DCE3EA', line2:'#C9D3DD', blue:'#1789C9', blueInk:'#0E6399',
  cyan:'#34CFE8', sun:'#F5A524', sunInk:'#8A5300', sunSoft:'#FFF3DC', r:'#FF4D3D', g:'#2BD46B', b:'#2F7BFF', white:'#FFFFFF' };
const F = { disp:'Karantina', body:'Heebo', num:'"Big Shoulders Stencil Display"' };

/* ---------------- math ---------------- */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: k => 1 - Math.pow(1 - k, 3), in: k => k * k * k, inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  quint: k => 1 - Math.pow(1 - k, 5), expo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k),
  back: k => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  spring: k => k >= 1 ? 1 : 1 - Math.exp(-6 * k) * Math.cos(9 * k)
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const fmt = n => Math.round(n).toLocaleString('en-US');

/* ---------------- layout ---------------- */
const L = {
  badgeY: S(246, 36), badgeW: S(300, 250),
  hSize: S(158, 118), hY1: S(478, 194), hY2: S(636, 316),
  sun: [W * 0.85, S(205, 100)],
  meterY: S(690, 362), meterH: S(222, 214),
  chipY: S(800, 520),
  tivi2: { x: S(880, 900), feet: S(1470, 1085), s: S(13, 10) },
  dev: { cx: 540, cy: S(1004, 640), w: S(960, 900) },
  kickY: S(408, 112), labelY: S(600, 262), labelSize: S(190, 150),
  plateY: S(1350, 966),
  s5: { cy: S(1075, 800), port: S(396, 370), countY: S(646, 318), labelY: S(560, 250) },
  q: { k1: S(440, 150), k2: S(540, 240), kSize: S(104, 88), stars: S(700, 332), q1: S(880, 486), q2: S(1040, 606), qSize: S(150, 118), att: S(1150, 690), att2: S(1210, 742) },
  sp: { h1: S(470, 150), h2: S(610, 262), hSize: S(128, 104), top: S(700, 362), tileH: S(300, 330), gap: 24 },
  t7: { x: 540, feet: S(1330, 1000), s: S(20, 16), bubCy: S(700, 440), bubW: S(840, 800), bubH: S(300, 270) },
  end: { logoTop: S(468, 196), logoW: S(880, 780), tagY: S(730, 438), tagSize: S(88, 74), btnCy: S(882, 566), btnW: S(650, 580), btnH: S(132, 116),
    urlY: S(1048, 712), phoneY: S(1118, 774), chipsY: S(1188, 832), tivi: { x: 540, feet: S(1440, 1108), s: S(10, 10) } }
};

/* ---------------- assets ---------------- */
const IM = {}, IC = {}, FR = {};
function img(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => i.decode().then(() => res(i), () => res(i)); i.onerror = () => rej(new Error('load ' + src)); i.src = src; }); }
async function loadAll() {
  const P = [];
  for (const n of ['s_pool', 's_poolnight', 's_garden', 's_cinema', 's_trans', 's_wall', 's_meira', 's_pizza'])
    P.push(img('img/' + n + '.jpg').then(i => IM[n.slice(2)] = i));
  P.push(img('img/logo-ink.svg').then(i => IM.logo = i));
  for (const n of ['sun', 'drop', 'clock', 'shield', 'wa', 'tel', 'pin']) P.push(img(`img/i-${n}-ink.svg`).then(i => IC[n] = i));
  for (const n of ['meira2', 'pizza', 'meira']) {
    FR[n] = [];
    for (let i = 1; i <= 90; i++) P.push(img(`work/${n}/${String(i).padStart(3, '0')}.jpg`).then(im => FR[n][i - 1] = im));
  }
  const faces = ['700 100px Karantina', '400 100px Karantina', '500 40px Heebo', '700 40px Heebo', '800 40px Heebo', '900 40px Heebo', `800 60px ${F.num}`, `900 60px ${F.num}`];
  P.push(...faces.map(f => document.fonts.load(f, 'אבגד 0123 NIT')));
  await Promise.all(P);
  await document.fonts.ready;
}

/* grain */
const GR = document.createElement('canvas'); GR.width = GR.height = 256;
{ const g = GR.getContext('2d'), d = g.createImageData(256, 256), r = rng(7); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }

/* ---------------- drawing helpers ---------------- */
function rr(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); X.beginPath(); X.moveTo(x + r, y); X.arcTo(x + w, y, x + w, y + h, r); X.arcTo(x + w, y + h, x, y + h, r); X.arcTo(x, y + h, x, y, r); X.arcTo(x, y, x + w, y, r); X.closePath(); }
const fnt = (w, s, fam) => `${w} ${s}px ${fam}`;
const isLtr = s => !/[֐-׿]/.test(s);
/* Isolate LTR runs (numbers, ranges, Latin) inside Hebrew so the bidi algorithm can't reorder them:
   '400–600 NIT' must not become 'NIT 600–400', nor '4K · HDR' become 'HDR · 4K'. */
function bidi(s) {
  if (isLtr(s)) return '\u2066' + s + '\u2069';
  return s.replace(/[A-Za-z0-9][A-Za-z0-9 ,.×–\-″:/·]*/g, m => { const core = m.replace(/[\s·.,:–-]+$/, ''); return '\u2066' + core + '\u2069' + m.slice(core.length); });
}
function tw(text, f) { X.font = f; X.letterSpacing = '0px'; return X.measureText(text).width; }

/* A line of words, laid out right-to-left, each word with its own reveal/exit. */
function words(list, o) {
  const items = list.map(w => typeof w === 'string' ? { t: w } : w);
  const f = fnt(o.w || 700, o.size, o.fam || F.disp);
  X.font = f; X.letterSpacing = o.ls || '0px';
  const gap = o.gap ?? o.size * 0.24;
  const ws = items.map(it => X.measureText(it.t).width);
  const total = ws.reduce((a, b) => a + b, 0) + gap * (items.length - 1);
  let xr = o.align === 'right' ? o.x : o.align === 'left' ? o.x + total : o.x + total / 2;
  const asc = o.size * 0.86, desc = o.size * 0.26;
  items.forEach((it, i) => {
    const p = o.rev ? clamp(o.rev(i)) : 1, q = o.exit ? clamp(o.exit(i)) : 0, w = ws[i];
    if (p > 0 && q < 1) {
      const e = E.quint(p), eq = E.in(q);
      X.save();
      if (o.mask !== false) { X.beginPath(); X.rect(xr - w - o.size * .4, o.y - asc - o.size * .3, w + o.size * .8, asc + desc + o.size * .45); X.clip(); }
      if (it.hl && o.hl) {
        const hp = E.out(clamp(o.hl(i))), hdy = (1 - e) * (o.rise ?? o.size * 1.1) - eq * o.size * 1.1;
        if (hp > 0) { X.fillStyle = `rgba(245,165,36,${.62 * (1 - eq)})`; X.fillRect(xr - w * hp - o.size * .04, o.y - o.size * .27 + hdy, w * hp + o.size * .08, o.size * .25); }
      }
      const fx = it.fx ? it.fx() : null;
      X.globalAlpha *= (fx && fx.alpha != null ? fx.alpha : 1);
      if (fx && fx.blur) X.filter = `blur(${fx.blur}px)`;
      X.fillStyle = (fx && fx.color) || it.color || o.color || C.ink;
      X.direction = isLtr(it.t) ? 'ltr' : 'rtl'; X.textAlign = 'right'; X.textBaseline = 'alphabetic';
      let dy = (1 - e) * (o.rise ?? o.size * 1.1) - eq * o.size * 1.1;
      let sc = it.pop ? it.pop() : 1;
      if (sc !== 1) { X.translate(xr - w / 2, o.y - o.size * .3); X.scale(sc, sc); X.translate(-(xr - w / 2), -(o.y - o.size * .3)); }
      if (o.shadow) { X.shadowColor = o.shadow; X.shadowBlur = o.size * .35; }
      X.fillText(it.t, xr, o.y + dy);
      X.restore();
    }
    xr -= w + gap;
  });
  return total;
}
/* fit a list of words to maxW by shrinking the size */
function fitSize(list, size, maxW, w = 700, fam = F.disp) {
  X.font = fnt(w, size, fam); X.letterSpacing = '0px';
  const tot = list.map(x => X.measureText(typeof x === 'string' ? x : x.t).width).reduce((a, b) => a + b, 0) + size * .24 * (list.length - 1);
  return tot > maxW ? size * maxW / tot : size;
}
function text(t, x, y, o = {}) {
  X.save(); X.font = fnt(o.w || 500, o.size || 40, o.fam || F.body); X.letterSpacing = o.ls || '0px';
  X.fillStyle = o.color || C.ink; X.globalAlpha *= (o.alpha ?? 1);
  X.direction = o.dir || (isLtr(t) ? 'ltr' : 'rtl'); X.textAlign = o.align || 'center'; X.textBaseline = o.base || 'alphabetic';
  if (X.direction === 'rtl') t = bidi(t);
  if (o.shadow) { X.shadowColor = o.shadow; X.shadowBlur = o.shadowBlur || 20; }
  X.fillText(t, x, y); const m = X.measureText(t).width; X.restore(); return m;
}
/* pill: rounded chip with a status dot (site's .tag / .chip) */
function pill(label, x, y, o = {}) {
  const size = o.size || 32, padX = size * .72, h = size * 1.9, f = fnt(o.w || 600, size, F.body);
  X.save(); X.font = f; X.letterSpacing = '0px';
  const dot = o.dot ? size * .5 : 0, gap = o.dot ? size * .45 : 0;
  label = bidi(label);
  const w = X.measureText(label).width + padX * 2 + dot + gap;
  const x0 = o.align === 'right' ? x - w : o.align === 'left' ? x : x - w / 2;
  X.globalAlpha *= (o.alpha ?? 1);
  if (o.sc) { X.translate(x0 + w / 2, y); X.scale(o.sc, o.sc); X.translate(-(x0 + w / 2), -y); }
  if (o.shadow !== false) { X.shadowColor = 'rgba(7,19,31,.18)'; X.shadowBlur = size * .8; X.shadowOffsetY = size * .2; }
  rr(x0, y - h / 2, w, h, h / 2); X.fillStyle = o.bg || C.white; X.fill();
  X.shadowColor = 'transparent';
  if (o.border) { X.lineWidth = o.border; X.strokeStyle = o.bc || C.line2; X.stroke(); }
  if (o.dot) {
    const dx = x0 + w - padX - dot / 2;
    X.beginPath(); X.arc(dx, y, dot / 2 + size * .16, 0, 7); X.fillStyle = o.dot + '44'; X.fill();
    X.beginPath(); X.arc(dx, y, dot / 2, 0, 7); X.fillStyle = o.dot; X.fill();
  }
  X.fillStyle = o.fg || C.ink; X.direction = 'rtl'; X.textAlign = 'right'; X.textBaseline = 'middle';
  X.fillText(label, x0 + w - padX - dot - gap, y + size * .06);
  X.restore(); return w;
}
function tag(label, x, y, real, alpha = 1) { // site's dark .tag, anchored at its right edge
  return pill(label, x, y, { size: S(26, 22), bg: 'rgba(7,19,31,.74)', fg: '#fff', dot: real ? C.g : C.cyan, align: 'right', alpha, shadow: false, w: 600 });
}
function paperBG(t, glow = 1) {
  X.fillStyle = C.paper; X.fillRect(0, 0, W, H);
  const g = X.createRadialGradient(W * .9, H * .02, 0, W * .9, H * .02, W * 1.15);
  g.addColorStop(0, `rgba(245,165,36,${.24 * glow})`); g.addColorStop(.45, `rgba(245,165,36,${.08 * glow})`); g.addColorStop(1, 'rgba(245,165,36,0)');
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  const g2 = X.createRadialGradient(W * .05, H * .98, 0, W * .05, H * .98, W * .9);
  g2.addColorStop(0, 'rgba(23,137,201,.10)'); g2.addColorStop(1, 'rgba(23,137,201,0)'); X.fillStyle = g2; X.fillRect(0, 0, W, H);
  // faint LED matrix texture
  X.save(); X.globalAlpha = .55; X.fillStyle = '#E3E9EF';
  const p = 34, off = (t * 6) % p;
  for (let y = -p + off; y < H + p; y += p) for (let x = (Math.round(y / p) % 2) * p / 2; x < W; x += p) { X.fillRect(x, y, 3, 3); }
  X.restore();
}
function grain(t, a = .05) {
  X.save(); X.globalAlpha = a; X.globalCompositeOperation = 'overlay';
  const pat = X.createPattern(GR, 'repeat'); const r = rng(Math.floor(t * 30) + 11);
  pat.setTransform(new DOMMatrix().translate(Math.floor(r() * 256), Math.floor(r() * 256)));
  X.fillStyle = pat; X.fillRect(0, 0, W, H); X.restore();
}
function vignette(a = .3) {
  const g = X.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .35, W / 2, H * .5, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(3,8,14,${a})`); X.fillStyle = g; X.fillRect(0, 0, W, H);
}
function badge(alpha) { // small brand mark at the top
  if (alpha <= 0) return;
  const w = L.badgeW, h = w * 66.4 / 448.3;
  X.save(); X.globalAlpha = alpha; X.drawImage(IM.logo, W / 2 - w / 2, L.badgeY - h / 2, w, h); X.restore();
}
function star(cx, cy, r, fill) {
  X.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * .45 : r; X.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  X.closePath(); X.fillStyle = fill; X.fill();
}

/* ---------------- LED renderer ---------------- */
const LC = document.createElement('canvas'), LX = LC.getContext('2d', { willReadFrequently: true });
const LY = document.createElement('canvas'), LYX = LY.getContext('2d');
const tiles = {};
function ledTile(p, style, gapColor) {
  const k = style + p.toFixed(2) + gapColor; if (tiles[k]) return tiles[k];
  const n = Math.max(2, Math.round(p)), c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d');
  if (style === 'rgb') {
    g.fillStyle = '#000'; g.fillRect(0, 0, n, n);
    const bw = n * .24, bh = n * .74, y0 = (n - bh) / 2;
    [['#ff2a1a', .06], ['#1aff4a', .38], ['#2a5bff', .70]].forEach(([col, x]) => { g.fillStyle = col; g.beginPath(); g.roundRect(n * x, y0, bw, bh, bw * .45); g.fill(); });
  } else {
    g.fillStyle = gapColor; g.fillRect(0, 0, n, n); g.globalCompositeOperation = 'destination-out';
    g.beginPath(); g.arc(n / 2, n / 2, n * .42, 0, 7); g.fill();
  }
  return tiles[k] = c;
}
/* Draw src (region) into dest as an LED matrix of pitch p.
   o.style: 'dot' | 'rgb'; o.wave(cx,cy) -> 0..1 per LED; o.bloom; o.gap (dot gap color); o.boost; o.clipR (rounded clip radius) */
function led(src, sx, sy, sw, sh, dx, dy, dw, dh, o = {}) {
  const p = Math.max(2, Math.round(o.pitch || 8));
  const cols = Math.ceil(dw / p), rows = Math.ceil(dh / p);
  LC.width = cols; LC.height = rows;
  LX.imageSmoothingEnabled = true; LX.imageSmoothingQuality = 'high'; LX.filter = o.filter || 'none';
  LX.drawImage(src, sx, sy, sw, sh, 0, 0, cols, rows); LX.filter = 'none';
  if (o.wave || o.boost) {
    const d = LX.getImageData(0, 0, cols, rows), a = d.data, b = o.boost || 1;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
      const m = (o.wave ? clamp(o.wave(x / cols, y / rows, x, y)) : 1) * b, i = (y * cols + x) * 4;
      a[i] = Math.min(255, a[i] * m); a[i + 1] = Math.min(255, a[i + 1] * m); a[i + 2] = Math.min(255, a[i + 2] * m);
    }
    LX.putImageData(d, 0, 0);
  }
  X.save();
  X.beginPath(); if (o.clipR) { X.roundRect(dx, dy, dw, dh, o.clipR); } else X.rect(dx, dy, dw, dh); X.clip();
  X.globalAlpha = o.alpha ?? 1;
  if (o.style === 'rgb') {
    LY.width = Math.ceil(dw); LY.height = Math.ceil(dh);
    LYX.imageSmoothingEnabled = false; LYX.globalCompositeOperation = 'source-over'; LYX.drawImage(LC, 0, 0, cols * p, rows * p);
    LYX.globalCompositeOperation = 'multiply'; const pat = LYX.createPattern(ledTile(p, 'rgb'), 'repeat'); LYX.fillStyle = pat; LYX.fillRect(0, 0, LY.width, LY.height);
    X.fillStyle = '#000'; X.fillRect(dx, dy, dw, dh);
    X.globalCompositeOperation = 'lighter'; X.drawImage(LY, dx, dy); X.drawImage(LY, dx, dy); X.globalAlpha *= .6; X.drawImage(LY, dx, dy);
  } else {
    X.imageSmoothingEnabled = false; X.drawImage(LC, dx, dy, cols * p, rows * p); X.imageSmoothingEnabled = true;
    const pat = X.createPattern(ledTile(p, 'dot', o.gap || '#03070B'), 'repeat'); pat.setTransform(new DOMMatrix().translate(dx, dy));
    X.fillStyle = pat; X.fillRect(dx, dy, dw, dh);
  }
  X.restore();

    X.save(); X.globalCompositeOperation = 'lighter'; X.globalAlpha = o.bloom; X.filter = `blur(${Math.round(p * .9 + (o.bloomR || 10))}px)`;
    X.imageSmoothingEnabled = true; X.drawImage(LC, dx, dy, cols * p, rows * p); X.restore();
  }
}
/* image cover-fit into a rect around a focus point; returns the source rect used */
function coverRect(im, dw, dh, fx = .5, fy = .5, zoom = 1) {
  const s = Math.max(dw / im.width, dh / im.height) * zoom, sw = dw / s, sh = dh / s;
  const sx = clamp(im.width * fx - sw / 2, 0, im.width - sw), sy = clamp(im.height * fy - sh / 2, 0, im.height - sh);
  return [sx, sy, sw, sh];
}

/* ---------------- device: the logo's TV box as a screen bezel ---------------- */
function device(cx, cy, gw, gh, o = {}) {
  const pad = S(13, 12), r = S(24, 22), x = cx - gw / 2 - pad, y = cy - gh / 2 - pad, w = gw + pad * 2, h = gh + pad * 2;
  X.save(); X.globalAlpha = o.alpha ?? 1;
  X.shadowColor = 'rgba(7,19,31,.42)'; X.shadowBlur = 70; X.shadowOffsetY = 34;
  rr(x, y, w, h, r); X.fillStyle = C.ink; X.fill(); X.shadowColor = 'transparent';
  rr(x + 5.5, y + 5.5, w - 11, h - 11, r - 5); X.lineWidth = 2; X.strokeStyle = 'rgba(255,255,255,.16)'; X.stroke();
  // RGB power LEDs on the bottom edge, like the logo box
  const ly = y + h - pad / 2 - 1, lw = S(13, 12);
  [[C.r, -1], [C.g, 0], [C.b, 1]].forEach(([c, i]) => { X.fillStyle = c; X.fillRect(cx + i * (lw + 4) - lw / 2, ly - 2, lw, 4); });
  X.restore();
  return { x: cx - gw / 2, y: cy - gh / 2, w: gw, h: gh, r: S(11, 10) };
}
function sheen(g, k) { // light sweep across the glass
  if (k <= 0 || k >= 1) return;
  X.save(); rr(g.x, g.y, g.w, g.h, g.r); X.clip();
  const x = lerp(g.x + g.w * 1.3, g.x - g.w * .5, E.inOut(k));
  const gr = X.createLinearGradient(x - 160, g.y, x + 160, g.y + g.h);
  gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.5, 'rgba(255,255,255,.22)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  X.fillStyle = gr; X.globalCompositeOperation = 'screen'; X.fillRect(g.x, g.y, g.w, g.h); X.restore();
}

/* ---------------- TIVI (pixel character born from the logo's TV box) ---------------- */
const TV = { INK: C.ink, GAP: C.paper, SCR: '#0B1A28', DIO: '#15293C', AMB: C.sun, BLU: C.blue };
const FACES = {
  open: [[6, 5, 2, 2], [14, 5, 2, 2], [9, 8, 4, 1], [8, 7], [13, 7]],
  look: [[5, 5, 2, 2], [13, 5, 2, 2], [8, 8, 4, 1], [7, 7], [12, 7]],
  blink: [[6, 6, 2, 1], [14, 6, 2, 1], [9, 8, 4, 1], [8, 7], [13, 7]],
  happy: [[5, 6], [6, 5], [7, 6], [13, 6], [14, 5], [15, 6], [8, 8, 6, 1], [7, 7], [14, 7], [9, 9, 4, 1]],
  o: [[6, 4, 2, 2], [14, 4, 2, 2], [10, 7, 2, 3]],
