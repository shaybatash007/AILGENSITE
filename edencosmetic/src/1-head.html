.kinds{display:flex;flex-wrap:wrap;gap:8px;flex:1 1 100%;order:3}.kind{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-weight:600;font-size:.9375rem;min-height:40px}.kind[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}.kind small{color:inherit;opacity:.7;margin-inline-start:6px}

.cnt2{color:var(--mute);font-size:.9375rem;margin:6px 0 16px}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}

.pc .bd{display:grid;gap:6px;padding:14px 16px 16px;align-content:start}.pc .br{font-size:.72rem;letter-spacing:.14em;color:var(--pa,var(--accent));font-weight:700;text-transform:uppercase;min-height:1em}@media (prefers-color-scheme:dark){.pc .br{color:var(--accent)}}.pc h3{font:600 1.0625rem/1.35 var(--body);letter-spacing:0}.pc h3 a{color:var(--ink);text-decoration:none}.pc h3 a:hover{text-decoration:underline}
.pc .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.pc .pr{font:700 1.4rem/1 var(--display)}.pc .pr s{font-size:.8rem;color:var(--mute);font-weight:400;margin-inline-start:6px}
.pc .add{border:0;background:var(--accent);color:var(--onAccent);border-radius:999px;min-height:42px;padding:0 16px;font-weight:700;display:inline-flex;align-items:center;gap:6px}.pc .add svg{width:20px;height:20px;--accent:currentColor}.pc .add.alt{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.more{text-align:center;margin-top:26px}
/* the brand shelf: every brand in its own colours (measured from its packaging), its own type, its real product */
.bt{font-family:var(--body)}.bt[data-type=caps-bold]{font-weight:800;letter-spacing:.14em;text-transform:uppercase}.bt[data-type=lower-light]{font-weight:300;letter-spacing:.02em;text-transform:lowercase}.bt[data-type=serif-classic]{font-family:var(--display);font-weight:600;letter-spacing:.01em}.bt[data-type=round-bold]{font-weight:800;letter-spacing:.05em}.bt[data-type=caps-heavy]{font-weight:800;letter-spacing:.07em;text-transform:uppercase}.bt[data-type=caps-light]{font-family:var(--lat);font-weight:400;letter-spacing:.2em;text-transform:uppercase}.bt[data-type=caps-wide]{font-family:var(--lat);font-weight:600;letter-spacing:.3em;text-transform:uppercase}.bt[data-type=house]{font-family:var(--display);font-weight:700}
.brands{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.bp{--bf:var(--blush);--bi:var(--ink);--ba:var(--accent);position:relative;display:flex;flex-direction:column;height:100%;min-height:370px;border-radius:26px;overflow:hidden;background:var(--bf);color:var(--bi);text-decoration:none;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}

.bp .im::before{content:"";position:absolute;width:74%;aspect-ratio:1;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ba) 30%,transparent),transparent);opacity:.55}
.bp .im img{position:relative;max-height:164px;width:auto;max-width:76%;object-fit:contain;filter:drop-shadow(-8px 14px 12px rgba(0,0,0,.26));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.bp:hover .im img{transform:translateY(-6px) rotate(-2deg)}

.bp .nm{font-size:1.55rem;line-height:1.05;margin:0}
.bp .or{font-size:.8125rem;opacity:.8;font-weight:700;letter-spacing:.04em;margin:0}
.bp .ln{font-size:.9375rem;opacity:.92;margin:0}
.bp .kz{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0;padding:0;list-style:none}.bp .kz li{font-size:.75rem;font-weight:700;border:1px solid color-mix(in srgb,var(--bi) 32%,transparent);border-radius:999px;padding:3px 9px}
.bp .go{margin-top:auto;padding-top:12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9375rem}.bp .go::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--ba)}
.bp.dark .go::before{background:color-mix(in srgb,var(--ba) 70%,#fff)}
/* about / two-column blocks */
.in.two,.about .in,#courses .in,#contact .in{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,80px);align-items:center}
.about .ph{margin:0;position:relative;border-radius:250px 250px 30px 30px;overflow:hidden;background:var(--blush);max-width:460px;justify-self:center;box-shadow:var(--shadow)}.about .ph img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:60% 30%}
.story p{font-size:1.1875rem;line-height:1.75;color:var(--ink);margin-bottom:.9em}.cite{font-size:.875rem;color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:clamp(20px,3vw,32px);display:grid;gap:14px;box-shadow:var(--shadow)}
form.card label{display:grid;gap:6px;font-weight:600}form.card input,form.card select,form.card textarea{min-height:52px;border:1.5px solid var(--line);border-radius:14px;background:var(--paper);padding:10px 14px;font-weight:400}form.card textarea{min-height:110px;resize:vertical}

.three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.three .card svg{width:38px;height:38px}.three h3{font-size:1.5rem}.three p{color:var(--mute);margin:0}.three a{font-weight:700;display:inline-flex;align-items:center;min-height:44px}
.faq details{border-bottom:1px solid var(--line)}.faq summary{cursor:pointer;list-style:none;padding:20px 4px;font:600 1.25rem/1.35 var(--display);display:flex;justify-content:space-between;gap:16px;align-items:center}.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:"+";font:400 1.8rem/1 var(--body);color:var(--accent);transition:transform .3s}.faq details[open] summary::after{transform:rotate(45deg)}.faq details p{padding:0 4px 20px;color:var(--mute);margin:0;max-width:70ch}
.ct{list-style:none;padding:0;margin:20px 0 0;display:grid;gap:12px}.ct li{display:flex;align-items:center;gap:12px}.ct svg{width:28px;height:28px;flex:none}.ct a{color:var(--ink);font-weight:600;text-decoration:none}.ct a:hover{text-decoration:underline}
/* footer */
.ft{background:var(--ink);color:var(--paper);padding-block:clamp(40px,6vw,72px) 32px;margin-top:0}.ft a{color:var(--paper);text-decoration:none;opacity:.9}.ft a:hover{text-decoration:underline;opacity:1}.ft .lnk{color:var(--paper)}

.tr{margin:8px 0 0;color:var(--mute)}.tr summary{cursor:pointer;font-weight:700;color:var(--ink);padding:6px 0;min-height:44px;display:flex;align-items:center}.tr p{margin:8px 0 0;font-size:.9375rem;line-height:1.7}

.faq{max-width:860px;margin-top:clamp(36px,5vw,56px)}.faqh{font-size:clamp(1.5rem,2.6vw,2rem);margin-bottom:6px}
.fbl{width:min(260px,100%);height:auto;color:var(--paper)}.fb p a{text-decoration:underline;text-underline-offset:3px}.fb p{margin:16px 0 0;font-size:.9375rem;opacity:.85;max-width:34ch}
.all{margin-top:30px;border-top:1px solid color-mix(in srgb,var(--paper) 18%,transparent);padding-top:18px}.all summary{cursor:pointer;font-weight:600;min-height:44px;display:flex;align-items:center}.all .cols{columns:3 240px;gap:24px;margin-top:14px;font-size:.9375rem;display:block}.all .cols li{break-inside:avoid;margin-bottom:6px}
