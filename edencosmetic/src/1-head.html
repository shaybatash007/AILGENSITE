.tabs{display:grid;align-content:start;gap:4px;padding:16px;background:var(--surface);border-inline-end:1px solid var(--line)}.tab{text-align:start;border:0;background:none;padding:12px 14px;border-radius:12px;font-weight:600}.tab.on{background:var(--accentSoft);color:var(--accent)}.tab[data-t=close]{margin-top:auto;border:1.4px solid var(--line)}
.adm .main{padding:26px clamp(16px,3vw,40px);overflow:auto}.adm h2{font-size:2rem}.adm .sub{color:var(--mute);margin:6px 0 20px}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}.kpi b{display:block;font:700 2.2rem/1 var(--display)}.kpi.hot{border-color:var(--accent);background:var(--accentSoft)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;margin-bottom:12px}.box input,.box textarea,.box select{border:1.4px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--paper);width:100%}.box textarea{min-height:80px}.cform{display:grid;gap:12px}.savebar{display:flex;gap:12px;align-items:center;position:sticky;bottom:0;padding:12px 0;background:var(--paper)}
.lead-row{display:grid;grid-template-columns:2fr 1.2fr 1fr auto;gap:10px 16px;align-items:start}.badge{display:inline-block;font-size:.75rem;font-weight:700;background:var(--accentSoft);color:var(--accent);border-radius:999px;padding:2px 10px;margin-inline-end:6px}.msg{grid-column:1/-1;margin:0;background:var(--paper);border-radius:10px;padding:8px 12px;white-space:pre-wrap}.empty{color:var(--mute)}.mono{font-family:ui-monospace,Menlo,monospace}
.mini.warn{color:#B3261E;border-color:#B3261E}.confirm{display:flex;gap:6px;align-items:center}

@media (max-width:980px){.nav{display:none}.burger{display:inline-grid}.faq{grid-template-columns:1fr}.faqs{position:static}.tb{grid-template-columns:1fr 1fr}.qwrap{grid-column:1/-1}.chk{grid-column:1/-1}.hdr .in{gap:8px}.tools{margin-inline-start:auto}.hero .in,.about .in,#courses .in,#contact .in{grid-template-columns:1fr}.hero .vis{max-width:460px}.sh{grid-template-columns:1fr}.brands{grid-template-columns:repeat(2,minmax(0,1fr))}.about .ph{max-width:360px}.three{grid-template-columns:1fr}.qg{grid-template-columns:1fr}.adm{grid-template-columns:1fr;grid-template-rows:auto 1fr}.tabs{grid-auto-flow:column;overflow:auto;border:0;border-bottom:1px solid var(--line)}.lead-row{grid-template-columns:1fr}}
@media (max-width:700px){.mbar{display:flex}.kb{grid-template-columns:minmax(0,1fr)}.ks{position:static}.kq{grid-template-columns:1fr}
.krow{grid-template-columns:auto 64px minmax(0,1fr);gap:12px;padding:10px 12px 10px 10px}.krow .pr{grid-column:3;justify-self:start;font-size:1.2rem;margin-top:-4px}.kim{width:64px;height:64px;border-radius:14px}.kim img{width:48px;height:48px}.kim.ph img{width:64px;height:64px;border-radius:14px}

.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 12px}.pc .bd{padding:10px 2px 0}.pc h3{font-size:.9688rem}.pc .pr{font-size:1.2rem}.pc .add{width:40px;height:40px}.tb{grid-template-columns:1fr 1fr}.sel select{width:100%}
.fl2{grid-template-columns:1fr}.lotti{bottom:84px;inset-inline-end:10px}.lbtn{width:64px;height:70px}.agent{inset-inline:8px;bottom:8px;width:auto;height:82vh}

.brands{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:76%;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;margin-inline:calc(-1 * clamp(16px,4vw,40px));padding-inline:clamp(16px,4vw,40px);scroll-padding-inline:clamp(16px,4vw,40px)}.brands>li{scroll-snap-align:start}.bp{min-height:340px}
